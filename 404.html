<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The page you are looking for could not be found. Visit PT Autotube Crew Studio">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#08090c">
  <link rel="icon" type="image/png" href="logo.png.png">
  <title>Page Not Found | PT Autotube Crew Studio</title>

  <style>
    :root {
      color-scheme: dark;
      --background: #08090c;
      --surface: #11141a;
      --text: #f5f6f8;
      --muted: #a2a8b3;
      --line: rgba(255, 255, 255, 0.13);
      --accent: #f21d2f;
      --accent-light: #ff4655;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 50% 45%, rgba(242, 29, 47, 0.13), transparent 34rem),
        var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.65;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--accent-light);
      outline-offset: 4px;
    }

    .container {
      width: min(92%, 1200px);
      margin-inline: auto;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--line);
      background: rgba(8, 9, 12, 0.94);
      backdrop-filter: blur(14px);
    }

    .header-inner {
      min-height: 96px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: flex;
      min-width: 0;
      align-items: center;
    }

    .logo-window {
      width: 140px;
      height: 102px;
      flex: 0 0 auto;
      overflow: hidden;
    }

    .logo-window img {
      display: block;
      width: 140px;
      height: 140px;
      object-fit: contain;
      object-position: center top;
    }

    .site-nav ul {
      display: flex;
      align-items: center;
      gap: clamp(12px, 2vw, 26px);
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .site-nav a {
      color: #d0d3d9;
      font-size: 13px;
      transition: color 180ms ease;
    }

    .site-nav a:hover {
      color: #ffffff;
    }

    .site-nav .nav-cta {
      padding: 10px 15px;
      border: 1px solid var(--line);
      color: #ffffff;
    }

    .menu-button,
    .mobile-nav {
      display: none;
    }

    .error-page {
      min-height: calc(100vh - 96px);
      min-height: calc(100svh - 96px);
      display: grid;
      place-items: center;
      padding: 80px 0;
      text-align: center;
    }

    .error-content {
      max-width: 760px;
      margin-inline: auto;
    }

    .error-code {
      margin-bottom: 12px;
      color: var(--accent);
      font-size: clamp(120px, 23vw, 230px);
      font-weight: 900;
      letter-spacing: -0.09em;
      line-height: 0.9;
      text-shadow: 0 0 70px rgba(242, 29, 47, 0.2);
    }

    .error-content h1 {
      margin: 22px 0 12px;
      font-size: clamp(30px, 5vw, 48px);
      letter-spacing: -0.04em;
      line-height: 1.1;
    }

    .error-content p {
      max-width: 580px;
      margin: 0 auto 30px;
      color: var(--muted);
      font-size: 16px;
    }

    .error-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border: 1px solid transparent;
      font-size: 13px;
      font-weight: 700;
      transition:
        transform 180ms ease,
        background 180ms ease,
        border-color 180ms ease;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .button-primary {
      background: var(--accent);
      color: #ffffff;
    }

    .button-primary:hover {
      background: #d81728;
    }

    .button-secondary {
      border-color: var(--line);
      color: #ffffff;
    }

    .button-secondary:hover {
      border-color: rgba(255, 255, 255, 0.45);
    }

    .site-footer {
      padding: 22px 0;
      border-top: 1px solid var(--line);
      background: #06070a;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .site-footer p {
      margin: 0;
    }

    @media (max-width: 850px) {
      .header-inner {
        min-height: 82px;
        flex-wrap: wrap;
        gap: 0;
        padding-top: 4px;
        padding-bottom: 4px;
      }

      .logo-window {
        width: 112px;
        height: 82px;
      }

      .logo-window img {
        width: 112px;
        height: 112px;
      }

      .menu-button {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        padding: 8px 13px;
        border: 1px solid var(--line);
        background: transparent;
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
      }

      .site-nav {
        display: none;
        flex: 0 0 100%;
        padding: 8px 0 12px;
      }

      .site-nav.is-open {
        display: block;
      }

      .site-nav ul {
        align-items: stretch;
        flex-direction: column;
        gap: 0;
      }

      .site-nav li {
        border-top: 1px solid var(--line);
      }

      .site-nav a {
        display: block;
        padding: 11px 2px;
        font-size: 14px;
      }

      .site-nav .nav-cta {
        margin-top: 8px;
        padding: 11px 14px;
        text-align: center;
      }

      .error-page {
        min-height: calc(100vh - 82px);
        min-height: calc(100svh - 82px);
      }
    }

    @media (max-width: 560px) {
      .error-page {
        padding: 60px 0;
      }

      .error-content p {
        font-size: 14px;
      }

      .error-actions {
        align-items: center;
        flex-direction: column;
      }

      .button {
        width: 100%;
        max-width: 300px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="PT Autotube Crew Studio home">
        <span class="logo-window">
          <img src="logo.png.png" alt="PT Autotube Crew Studio logo">
        </span>
      </a>

      <button
        class="menu-button"
        id="menuButton"
        type="button"
        aria-controls="siteNav"
        aria-expanded="false"
        aria-label="Open navigation menu"
      >
        Menu
      </button>

      <nav class="site-nav" id="siteNav" aria-label="Main navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="portfolio.html">Portfolio</a></li>
          <li><a href="our-workflow.html">Workflow</a></li>
          <li><a class="nav-cta" href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="error-page">
      <div class="container error-content">
        <div class="error-code" aria-hidden="true">404</div>
        <h1>Page Not Found</h1>
        <p>
          This page may have moved or no longer exists. Return to our home page or contact the studio for help
        </p>

        <div class="error-actions">
          <a class="button button-primary" href="index.html">Return Home</a>
          <a class="button button-secondary" href="contact.html">Contact the Studio</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>PT Autotube Crew Studio</p>
    </div>
  </footer>

  <script>
    const menuButton = document.getElementById("menuButton");
    const siteNav = document.getElementById("siteNav");

    function closeMenu() {
      siteNav.classList.remove("is-open");
      menuButton.setAttribute("aria-expanded", "false");
      menuButton.setAttribute("aria-label", "Open navigation menu");
    }

    menuButton.addEventListener("click", function () {
      const isOpen = siteNav.classList.toggle("is-open");
      menuButton.setAttribute("aria-expanded", String(isOpen));
      menuButton.setAttribute(
        "aria-label",
        isOpen ? "Close navigation menu" : "Open navigation menu"
      );
    });

    siteNav.querySelectorAll("a").forEach(function (link) {
      link.addEventListener("click", closeMenu);
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        closeMenu();
      }
    });
  </script>
</body>
</html>
