/* =====================================================
ROOT
===================================================== */

:root{

--bg:#050505;

--bg2:#090909;

--bg3:#101010;

--red:#e50914;

--red2:#ff2936;

--white:#ffffff;

--text:#d2d2d2;

--muted:#999999;

--border:rgba(255,255,255,.10);

--glass:rgba(255,255,255,.055);

--shadow:0 25px 70px rgba(0,0,0,.55);

}


/* =====================================================
RESET
===================================================== */

*{

margin:0;

padding:0;

box-sizing:border-box;

}


html{

scroll-behavior:smooth;

}


body{

font-family:'Poppins',Arial,Helvetica,sans-serif;

background:var(--bg);

color:var(--white);

line-height:1.8;

overflow-x:hidden;

}


body::-webkit-scrollbar{

width:8px;

}


body::-webkit-scrollbar-track{

background:#050505;

}


body::-webkit-scrollbar-thumb{

background:#333;

border-radius:20px;

}


body::-webkit-scrollbar-thumb:hover{

background:var(--red);

}


a{

color:inherit;

text-decoration:none;

transition:.3s ease;

}


img{

display:block;

max-width:100%;

}


.container{

width:90%;

max-width:1400px;

margin:auto;

}


section{

padding:110px 0;

}


/* =====================================================
TYPOGRAPHY
===================================================== */

h1{

font-size:68px;

font-weight:800;

line-height:1.08;

letter-spacing:-2px;

}


h2{

font-size:46px;

font-weight:700;

line-height:1.2;

margin-bottom:22px;

}


h3{

font-size:24px;

font-weight:600;

line-height:1.35;

}


p{

font-size:17px;

color:var(--text);

}


.hero-label{

display:inline-block;

margin-bottom:20px;

color:var(--red);

font-size:13px;

font-weight:700;

letter-spacing:4px;

text-transform:uppercase;

}


.section-title{

max-width:850px;

margin:0 auto 60px;

text-align:center;

}


.section-title p{

max-width:760px;

margin:auto;

}


/* =====================================================
BUTTONS
===================================================== */

.btn{

display:inline-block;

padding:15px 38px;

background:var(--red);

border:1px solid var(--red);

border-radius:50px;

font-weight:600;

}


.btn:hover{

background:var(--red2);

border-color:var(--red2);

transform:translateY(-4px);

box-shadow:0 15px 35px rgba(229,9,20,.25);

}


.btn-outline{

display:inline-block;

padding:14px 38px;

border:1px solid rgba(255,255,255,.7);

border-radius:50px;

font-weight:600;

}


.btn-outline:hover{

background:#fff;

color:#000;

transform:translateY(-4px);

}


/* =====================================================
HEADER
===================================================== */

header{

position:fixed;

top:0;

left:0;

width:100%;

z-index:9999;

background:rgba(5,5,5,.45);

backdrop-filter:blur(18px);

-webkit-backdrop-filter:blur(18px);

border-bottom:1px solid rgba(255,255,255,.08);

transition:.35s ease;

}


header.scrolled{

background:rgba(3,3,3,.96);

box-shadow:0 15px 50px rgba(0,0,0,.45);

}


header .container{

height:90px;

display:flex;

align-items:center;

justify-content:space-between;

}


.logo{

display:flex;

align-items:center;

gap:13px;

font-size:21px;

font-weight:700;

white-space:nowrap;

}


.logo img{

width:54px;

height:54px;

object-fit:contain;

}


/* =====================================================
NAVIGATION
===================================================== */

nav ul{

display:flex;

align-items:center;

gap:28px;

list-style:none;

}


nav ul li{

position:relative;

}


nav ul li > a{

font-size:15px;

font-weight:500;

}


nav ul li > a:hover{

color:var(--red);

}


/* =====================================================
DROPDOWN
===================================================== */

.dropdown{

position:absolute;

top:125%;

left:0;

width:230px;

padding:8px;

background:rgba(12,12,12,.98);

border:1px solid rgba(255,255,255,.10);

border-radius:18px;

box-shadow:0 25px 60px rgba(0,0,0,.65);

opacity:0;

visibility:hidden;

transform:translateY(12px);

transition:.3s ease;

}


.dropdown a{

display:block;

padding:12px 16px;

border-radius:12px;

font-size:14px;

color:#d5d5d5;

}


.dropdown a:hover{

background:rgba(229,9,20,.12);

color:#fff;

padding-left:22px;

}


nav ul li:hover .dropdown{

opacity:1;

visibility:visible;

transform:translateY(0);

}


/* =====================================================
CONTACT HERO
===================================================== */

.contact-hero{

position:relative;

min-height:82vh;

display:flex;

align-items:center;

overflow:hidden;

background:

linear-gradient(

90deg,

rgba(0,0,0,.96),

rgba(0,0,0,.72),

rgba(0,0,0,.92)

),

url("portfolio05.png.png")

center/cover no-repeat;

}


.contact-hero::before{

content:"";

position:absolute;

width:650px;

height:650px;

right:-250px;

top:-100px;

background:rgba(229,9,20,.15);

filter:blur(130px);

border-radius:50%;

pointer-events:none;

}


.contact-hero::after{

content:"";

position:absolute;

width:500px;

height:500px;

left:-250px;

bottom:-300px;

background:rgba(255,255,255,.035);

filter:blur(120px);

border-radius:50%;

pointer-events:none;

}


.contact-hero-content{

position:relative;

z-index:2;

max-width:900px;

padding-top:90px;

}


.contact-hero-content p{

max-width:800px;

font-size:19px;

margin-top:22px;

}


.hero-buttons{

display:flex;

align-items:center;

gap:15px;

flex-wrap:wrap;

margin-top:38px;

}


/* =====================================================
CONTACT INTRO
===================================================== */

.contact-intro{

display:grid;

grid-template-columns:1fr 1fr;

gap:70px;

align-items:center;

}


.contact-intro-content{

max-width:650px;

}


.contact-intro-content p{

margin-bottom:20px;

}


.contact-intro-image{

height:540px;

border-radius:26px;

overflow:hidden;

border:1px solid var(--border);

box-shadow:var(--shadow);

}


.contact-intro-image img{

width:100%;

height:100%;

object-fit:cover;

transition:.6s ease;

}


.contact-intro-image:hover img{

transform:scale(1.06);

}


/* =====================================================
CONTACT INFORMATION
===================================================== */

.contact-info-grid{

display:grid;

grid-template-columns:

repeat(3,1fr);

gap:22px;

}


.contact-info-card{

padding:32px;

background:var(--glass);

border:1px solid var(--border);

border-radius:20px;

transition:.4s ease;

}


.contact-info-card:hover{

transform:translateY(-8px);

border-color:rgba(229,9,20,.65);

box-shadow:var(--shadow);

}


.contact-info-label{

font-size:12px;

font-weight:700;

letter-spacing:2px;

color:var(--red);

text-transform:uppercase;

margin-bottom:12px;

}


.contact-info-card h3{

font-size:21px;

margin-bottom:8px;

}


.contact-info-card p{

font-size:14px;

color:#999;

}

/* =====================================================
LEADERSHIP SECTION
===================================================== */

.leadership-section{

background:

radial-gradient(

circle at 50% 0%,

rgba(229,9,20,.10),

transparent 55%

),

#070707;

}


.leadership-grid{

display:grid;

grid-template-columns:

repeat(3,1fr);

gap:28px;

}


/* =====================================================
LEADER CARD
===================================================== */

.leader-card{

position:relative;

background:rgba(255,255,255,.045);

border:1px solid var(--border);

border-radius:25px;

overflow:hidden;

transition:.45s ease;

}


.leader-card:hover{

transform:translateY(-10px);

border-color:rgba(229,9,20,.65);

box-shadow:

0 30px 70px rgba(0,0,0,.55);

}


/* =====================================================
LEADER IMAGE
===================================================== */

.leader-image{

position:relative;

height:430px;

overflow:hidden;

background:#111;

}


.leader-image img{

width:100%;

height:100%;

object-fit:cover;

transition:.7s ease;

}


.leader-card:hover .leader-image img{

transform:scale(1.06);

}


/* =====================================================
IMAGE OVERLAY
===================================================== */

.leader-image::after{

content:"";

position:absolute;

left:0;

right:0;

bottom:0;

height:45%;

background:

linear-gradient(

transparent,

rgba(0,0,0,.85)

);

pointer-events:none;

}


/* =====================================================
LEADER CONTENT
===================================================== */

.leader-content{

padding:30px;

}


.leader-position{

display:inline-block;

margin-bottom:10px;

color:var(--red);

font-size:12px;

font-weight:700;

letter-spacing:2px;

text-transform:uppercase;

cursor:pointer;

}


.leader-name{

font-size:27px;

font-weight:700;

margin-bottom:16px;

cursor:pointer;

transition:.3s ease;

}


.leader-name:hover{

color:var(--red);

}


/* =====================================================
LEADER DETAILS
===================================================== */

.leader-details{

max-height:0;

overflow:hidden;

opacity:0;

transform:translateY(-8px);

transition:

max-height .5s ease,

opacity .4s ease,

transform .4s ease;

}


.leader-card.active .leader-details{

max-height:150px;

opacity:1;

transform:translateY(0);

}


.leader-details p{

font-size:14px;

line-height:1.7;

color:#a9a9a9;

margin-bottom:22px;

}


/* =====================================================
LEADER ACTIONS
===================================================== */

.leader-actions{

display:flex;

gap:10px;

flex-wrap:wrap;

}


.leader-action{

display:inline-flex;

align-items:center;

justify-content:center;

padding:10px 19px;

border-radius:30px;

border:1px solid rgba(255,255,255,.14);

background:rgba(255,255,255,.045);

font-size:13px;

font-weight:600;

transition:.3s ease;

}


.leader-action:hover{

background:var(--red);

border-color:var(--red);

transform:translateY(-3px);

}


.leader-action.call{

background:var(--red);

border-color:var(--red);

}


.leader-action.call:hover{

background:var(--red2);

border-color:var(--red2);

}


/* =====================================================
DIRECT CONTACT
===================================================== */

.direct-contact{

display:grid;

grid-template-columns:1.2fr .8fr;

gap:30px;

margin-top:60px;

}


.direct-contact-card{

padding:38px;

background:rgba(255,255,255,.045);

border:1px solid var(--border);

border-radius:22px;

transition:.4s ease;

}


.direct-contact-card:hover{

border-color:rgba(229,9,20,.5);

transform:translateY(-5px);

}


.direct-contact-card h3{

margin-bottom:12px;

}


.direct-contact-card p{

font-size:15px;

color:#999;

margin-bottom:20px;

}


.contact-link{

display:inline-block;

font-size:15px;

font-weight:600;

color:#fff;

word-break:break-word;

}


.contact-link:hover{

color:var(--red);

}


/* =====================================================
CONTACT FORM
===================================================== */

.contact-form-section{

display:grid;

grid-template-columns:.85fr 1.15fr;

gap:70px;

align-items:start;

}


.contact-form-info{

max-width:520px;

}


.contact-form-info p{

margin-bottom:20px;

}


.form-points{

display:flex;

flex-direction:column;

gap:14px;

margin-top:30px;

}


.form-point{

padding:17px 20px;

background:rgba(255,255,255,.035);

border:1px solid rgba(255,255,255,.08);

border-radius:14px;

font-size:14px;

color:#aaa;

transition:.3s ease;

}


.form-point:hover{

border-color:rgba(229,9,20,.5);

transform:translateX(5px);

}


.form-point strong{

display:block;

color:#fff;

margin-bottom:3px;

}


.form-box{

padding:38px;

background:rgba(255,255,255,.045);

border:1px solid var(--border);

border-radius:24px;

box-shadow:var(--shadow);

}


.form-group{

margin-bottom:20px;

}


.form-group label{

display:block;

margin-bottom:8px;

font-size:13px;

font-weight:600;

color:#ddd;

}


.form-group input,

.form-group textarea,

.form-group select{

width:100%;

padding:15px 17px;

background:#090909;

border:1px solid rgba(255,255,255,.12);

border-radius:12px;

outline:none;

color:#fff;

font-family:inherit;

font-size:14px;

transition:.3s ease;

}


.form-group input:focus,

.form-group textarea:focus,

.form-group select:focus{

border-color:var(--red);

box-shadow:

0 0 0 3px rgba(229,9,20,.10);

}


.form-group textarea{

min-height:150px;

resize:vertical;

}


.form-group select{

appearance:none;

cursor:pointer;

}


.form-row{

display:grid;

grid-template-columns:1fr 1fr;

gap:18px;

}


.form-submit{

width:100%;

border:none;

cursor:pointer;

font-family:inherit;

font-size:15px;

}


/* =====================================================
STUDIO LOCATION
===================================================== */

.location-section{

background:#080808;

}


.location-grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:30px;

}


.location-card{

min-height:330px;

padding:40px;

border-radius:24px;

border:1px solid var(--border);

background:

linear-gradient(

145deg,

rgba(255,255,255,.055),

);

}


.location-card h3{

margin-bottom:15px;

}


.location-card p{

font-size:15px;

color:#999;

}


.location-details{

margin-top:28px;

display:flex;

flex-direction:column;

gap:13px;

}


.location-detail{

display:flex;

gap:12px;

align-items:flex-start;

}


.location-detail strong{

min-width:85px;

font-size:13px;

color:#fff;

}


.location-detail span{

font-size:14px;

color:#999;

}


.location-map{

min-height:330px;

border-radius:24px;

overflow:hidden;

border:1px solid var(--border);

background:

linear-gradient(

135deg,

#111,

#070707

);

display:flex;

align-items:center;

justify-content:center;

text-align:center;

padding:40px;

position:relative;

}


.location-map::before{

content:"";

position:absolute;

width:260px;

height:260px;

background:rgba(229,9,20,.12);

filter:blur(90px);

border-radius:50%;

}


.location-map-content{

position:relative;

z-index:2;

}


.location-map-content h3{

margin-bottom:10px;

}


.location-map-content p{

font-size:14px;

color:#888;

margin-bottom:20px;

}


/* =====================================================
SOCIAL CONTACT
===================================================== */

.social-contact{

display:flex;

gap:12px;

flex-wrap:wrap;

margin-top:25px;

}


.social-contact a{

display:inline-flex;

align-items:center;

justify-content:center;

padding:11px 20px;

border:1px solid rgba(255,255,255,.12);

border-radius:30px;

font-size:13px;

font-weight:600;

}


.social-contact a:hover{

background:var(--red);

border-color:var(--red);

transform:translateY(-3px);

}

<script>

/* =====================================================
HEADER SCROLL
===================================================== */

const header = document.querySelector("header");


window.addEventListener("scroll", function(){

if(window.scrollY > 60){

header.classList.add("scrolled");

}else{

header.classList.remove("scrolled");

}

});


/* =====================================================
LEADERSHIP DETAILS
===================================================== */

function toggleLeader(element){

const card = element.closest(".leader-card");

document.querySelectorAll(".leader-card").forEach(function(item){

if(item !== card){

item.classList.remove("active");

}

});


card.classList.toggle("active");

}


/* =====================================================
BACK TO TOP
===================================================== */

const topBtn = document.getElementById("topBtn");


window.addEventListener("scroll", function(){

if(window.scrollY > 500){

topBtn.style.display = "flex";

}else{

topBtn.style.display = "none";

}

});


topBtn.addEventListener("click", function(){

window.scrollTo({

top:0,

behavior:"smooth"

});

});


/* =====================================================
SCROLL REVEAL
===================================================== */

const revealElements = document.querySelectorAll(

".contact-info-card, .leader-card, .direct-contact-card, .form-box, .form-point, .location-card, .location-map"

);


const revealObserver = new IntersectionObserver(

function(entries, observer){

entries.forEach(function(entry){

if(entry.isIntersecting){

entry.target.classList.add("visible");

observer.unobserve(entry.target);

}

});

},

{

threshold:0.12

}

);


revealElements.forEach(function(element){

element.classList.add("reveal");

revealObserver.observe(element);

});


/* =====================================================
SMOOTH ANCHOR LINKS
===================================================== */

document.querySelectorAll('a[href^="#"]').forEach(function(link){

link.addEventListener("click", function(event){

const targetId = this.getAttribute("href");


if(targetId === "#"){

return;

}


const target = document.querySelector(targetId);


if(target){

event.preventDefault();

target.scrollIntoView({

behavior:"smooth",

block:"start"

});

}

});

});


/* =====================================================
FORM FEEDBACK
===================================================== */

const inquiryForm = document.querySelector("#inquiry form");


if(inquiryForm){

inquiryForm.addEventListener("submit", function(){

const submitButton = inquiryForm.querySelector(".form-submit");

submitButton.textContent = "Opening Email";

});

}


/* =====================================================
IMAGE FALLBACK
===================================================== */

document.querySelectorAll("img").forEach(function(image){

image.addEventListener("error", function(){

this.style.background =

"linear-gradient(135deg,#151515,#050505)";

});

});


</script>
